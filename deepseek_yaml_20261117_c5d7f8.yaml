name: Build SIMIYUFX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/simiyufx
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/brand_navy</item>
                  <item name="android:statusBarColor">@color/brand_navy</item>
                  <item name="android:navigationBarColor">@color/brand_navy</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="brand_navy">#101C32</color>
              <color name="brand_gold">#D6AD62</color>
              <color name="ic_launcher_background">#101C32</color>
              <color name="candle_up">#16C784</color>
              <color name="candle_down">#FF5364</color>
              <color name="candle_wick">#D6AD62</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">SIMIYUFX</string>
              <string name="entry_url">file:///android_asset/SIMIYUFX.html</string>
              <string name="error_title">Couldn\'t load page</string>
              <string name="error_message">Something went wrong. Try again.</string>
              <string name="retry">Retry</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/brand_navy">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:layout_gravity="top"
                  android:indeterminate="false"
                  android:max="100"
                  android:progressTint="@color/brand_gold" />

              <LinearLayout
                  android:id="@+id/errorPanel"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="32dp"
                  android:background="@color/brand_navy"
                  android:visibility="gone">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/error_title"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:gravity="center"
                      android:text="@string/error_message"
                      android:textColor="#B5C0CE"
                      android:textSize="14sp" />
                  <Button
                      android:id="@+id/retryBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="22dp"
                      android:paddingLeft="26dp"
                      android:paddingRight="26dp"
                      android:backgroundTint="@color/brand_gold"
                      android:textColor="#101C32"
                      android:textStyle="bold"
                      android:text="@string/retry" />
              </LinearLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:strokeColor="#D6AD62" android:strokeWidth="1.6"
                    android:strokeLineCap="round" android:pathData="M33,34 L33,66" />
              <path android:strokeColor="#D6AD62" android:strokeWidth="1.6"
                    android:strokeLineCap="round" android:pathData="M51,26 L51,74" />
              <path android:strokeColor="#D6AD62" android:strokeWidth="1.6"
                    android:strokeLineCap="round" android:pathData="M69,30 L69,70" />
              <path android:strokeColor="#D6AD62" android:strokeWidth="1.6"
                    android:strokeLineCap="round" android:pathData="M87,38 L87,64" />
              <path android:fillColor="#FF5364" android:pathData="M27,42 h12 v18 h-12 z" />
              <path android:fillColor="#16C784" android:pathData="M45,36 h12 v30 h-12 z" />
              <path android:fillColor="#FF5364" android:pathData="M63,40 h12 v22 h-12 z" />
              <path android:fillColor="#16C784" android:pathData="M81,46 h12 v14 h-12 z" />
              <path android:strokeColor="#D6AD62" android:strokeWidth="1"
                    android:strokeAlpha="0.45" android:pathData="M22,78 L92,78" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/simiyufx/MainActivity.java << 'EOF'
          package com.simiyufx;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JsResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {

              private WebView webView;
              private ProgressBar progressBar;
              private LinearLayout errorPanel;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  errorPanel = findViewById(R.id.errorPanel);
                  Button retryBtn = findViewById(R.id.retryBtn);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                          errorPanel.setVisibility(View.GONE);
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request,
                                                  WebResourceError error) {
                          if (request != null && request.isForMainFrame()) {
                              progressBar.setVisibility(View.GONE);
                              errorPanel.setVisibility(View.VISIBLE);
                          }
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view,
                                                              WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme() != null ? uri.getScheme().toLowerCase() : "";
                          String host = uri.getHost() != null ? uri.getHost().toLowerCase() : "";
                          if ("file".equals(scheme)) return false;
                          if (("https".equals(scheme) || "http".equals(scheme))
                                  && host.endsWith("simiyufx.github.io")) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  // REQUIRED: makes confirm(), alert(), prompt() work in the WebView.
                  // Without this, deleteTrade()'s confirm() call throws and the
                  // delete handler aborts silently — which is exactly why delete
                  // worked in the browser but not in the APK.
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message,
                                               final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok,
                                          (d, w) -> result.confirm())
                                  .setOnCancelListener(d -> result.cancel())
                                  .show();
                          return true;
                      }
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message,
                                                 final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok,
                                          (d, w) -> result.confirm())
                                  .setNegativeButton(android.R.string.cancel,
                                          (d, w) -> result.cancel())
                                  .setOnCancelListener(d -> result.cancel())
                                  .show();
                          return true;
                      }
                  });

                  retryBtn.setOnClickListener(v -> {
                      errorPanel.setVisibility(View.GONE);
                      webView.loadUrl(getString(R.string.entry_url));
                  });

                  webView.loadUrl(getString(R.string.entry_url));
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              compileSdk 35
              namespace 'com.simiyufx'

              defaultConfig {
                  applicationId 'com.simiyufx'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'android'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SIMIYUFX"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          EOF

          echo "✅ SIMIYUFX WebView project created."

      - name: Copy and patch web assets
        run: |
          # Both HTML files must be at the repo root.
          cp SIMIYUFX.html app/src/main/assets/SIMIYUFX.html
          cp TRADERS.html  app/src/main/assets/TRADERS.html

          # Rewrite the Learn Forex link so it opens TRADERS.html in the WebView.
          python3 - << 'PY'
          import pathlib, re
          p = pathlib.Path("app/src/main/assets/SIMIYUFX.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'href="https://simiyufx.github.io/LEARNEARN/TRADERS"',
              'href="TRADERS.html"'
          )
          s = re.sub(
              r'(<a class="learn-btn"\s+href="TRADERS.html"\s+)target="_blank"\s*',
              r'\1', s
          )
          p.write_text(s, encoding="utf-8")
          print("Patched SIMIYUFX.html: Learn Forex opens TRADERS.html in-app")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore app/debug.keystore \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SIMIYUFX, OU=SIMIYUFX, O=SIMIYUFX, L=Nairobi, ST=Nairobi, C=KE"

      - name: Build Signed APK
        run: chmod +x gradlew && ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMIYUFX-apk
          path: app/build/outputs/apk/debug/*.apk